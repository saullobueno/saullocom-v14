<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Root Background: Website dark gray #1a1a1a -->
  <rect width="1200" height="675" fill="#1a1a1a"/>
  
  <!-- Top Navigation Bar (#262626) -->
  <rect x="0" y="0" width="1200" height="56" fill="#262626" stroke="#333333" stroke-width="1"/>
  <rect x="24" y="16" width="24" height="24" rx="6" fill="#10b981"/>
  <text x="30" y="33" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">A</text>
  <text x="56" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f5f5f5">AI Customer Operations Platform</text>
  
  <rect x="360" y="14" width="200" height="28" rx="6" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <text x="375" y="33" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#10b981">● Org: Acme Enterprise</text>

  <rect x="1040" y="14" width="136" height="28" rx="6" fill="#10b981"/>
  <text x="1055" y="33" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ New Customer Ticket</text>

  <!-- Left Sidebar (#262626) -->
  <rect x="0" y="56" width="220" height="619" fill="#262626" stroke="#333333" stroke-width="1"/>
  
  <rect x="12" y="72" width="196" height="36" rx="6" fill="#10b981" opacity="0.15"/>
  <text x="24" y="95" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399">📥 Team Inbox (12)</text>
  <text x="24" y="135" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3">🎫 All Tickets</text>
  <text x="24" y="175" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3">📚 Knowledge Base (RAG)</text>
  <text x="24" y="215" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3">📊 Analytics &amp; SLAs</text>
  <text x="24" y="255" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3">👥 Teams &amp; Members</text>
  <text x="24" y="295" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3">💳 Billing (Stripe Mock)</text>
  <text x="24" y="335" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#a3a3a3">🔒 Audit Logs</text>

