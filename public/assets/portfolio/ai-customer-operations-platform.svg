  <rect x="475" y="73" width="70" height="20" rx="10" fill="#10b981" opacity="0.2"/>
  <text x="485" y="87" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">Groq LLM</text>

  <!-- Ticket Item 1 (Active) -->
  <rect x="230" y="105" width="320" height="90" rx="8" fill="#1a1a1a" stroke="#10b981" stroke-width="1.5"/>
  <text x="242" y="125" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f5f5f5">Payment API 500 error on checkout</text>
  <text x="242" y="145" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a3a3a3">Customer: tech@stripe.com • 4m ago</text>
  <rect x="242" y="158" width="75" height="18" rx="9" fill="#ef4444" opacity="0.2"/>
  <text x="252" y="171" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171">High Priority</text>
  <rect x="325" y="158" width="90" height="18" rx="9" fill="#f59e0b" opacity="0.2"/>
  <text x="333" y="171" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fbbf24">Frustrated (AI)</text>

  <!-- Ticket Item 2 -->
  <rect x="230" y="205" width="320" height="90" rx="8" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <text x="242" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">Unable to invite secondary admin</text>
  <text x="242" y="245" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a3a3a3">Customer: ops@acme.io • 22m ago</text>
  <rect x="242" y="258" width="75" height="18" rx="9" fill="#3b82f6" opacity="0.2"/>
  <text x="254" y="271" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#60a5fa">Medium</text>

  <!-- Ticket Item 3 -->
  <rect x="230" y="305" width="320" height="90" rx="8" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <text x="242" y="325" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e5e5e5">Webhook signature mismatch</text>
  <text x="242" y="345" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a3a3a3">Customer: dev@linear.app • 1h ago</text>

  <!-- Ticket Detail & Groq AI Triage Panel -->
  <rect x="560" y="56" width="640" height="619" fill="#262626"/>
  
  <text x="585" y="98" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">#TCK-4812 • Payment API 500 error on checkout</text>
  <text x="585" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#a3a3a3">Opened by tech@stripe.com • Tracked via /report/track without login</text>

  <!-- AI Automated Triage Box -->
  <rect x="585" y="140" width="590" height="160" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="612" cy="170" r="12" fill="#10b981"/>
  <text x="607" y="175" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#ffffff">⚡</text>
  <text x="632" y="174" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">GroqCloud AI Automated Ticket Triage (openai/gpt-oss-120b)</text>
  
  <text x="605" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#d1fae5">• Sentiment: Frustrated (-0.82) | Category: API Billing Fault | Priority: High</text>
  <text x="605" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#d1fae5">• RAG Match: "Fix 500 errors by rotating STRIPE_SECRET_KEY in settings"</text>
  
  <rect x="605" y="235" width="220" height="32" rx="6" fill="#10b981"/>
  <text x="620" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Apply AI Suggested Reply</text>

  <!-- Customer Message Card -->
  <rect x="585" y="320" width="590" height="120" rx="10" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <circle cx="610" cy="345" r="14" fill="#3b82f6"/>
  <text x="604" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">S</text>
  <text x="635" y="348" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f5f5f5">Stripe Customer Tech</text>
  <text x="760" y="348" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#a3a3a3">10:38 AM</text>
  <text x="605" y="375" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e5e5e5">
    <tspan x="605" dy="0">"Our checkout endpoint is returning HTTP 500 when processing customer credit cards.</tspan>
    <tspan x="605" dy="18">Can you check if the webhook signature key expired?"</tspan>
  </text>

  <!-- Internal Agent Reply Box -->
  <rect x="585" y="460" width="590" height="180" rx="10" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <text x="605" y="490" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#a3a3a3">Internal Agent Note / Reply to Customer...</text>
  <line x1="605" y1="505" x2="1155" y2="505" stroke="#333333" stroke-width="1"/>
  <text x="605" y="535" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#34d399">"Hello! Our AI triage identified the issue in the webhook secret configuration..."</text>
  <rect x="1050" y="590" width="110" height="36" rx="6" fill="#10b981"/>
  <text x="1105" y="613" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Send Reply</text>
</svg>
