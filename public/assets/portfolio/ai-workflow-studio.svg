<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Root Background: Website dark mode base (#1a1a1a) -->
  <rect width="1200" height="675" fill="#1a1a1a"/>
  
  <!-- Top Navigation Bar (#141414) -->
  <rect x="0" y="0" width="1200" height="56" fill="#141414" stroke="#333333" stroke-width="1"/>
  <rect x="24" y="16" width="24" height="24" rx="6" fill="#6366f1"/>
  <path d="M30 28 L36 20 L42 28 L36 36 Z" fill="#ffffff"/>
  <text x="56" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f9fafb">AI Workflow Studio</text>

  <!-- Command Palette & Undo/Redo HUD -->
  <rect x="260" y="14" width="240" height="28" rx="6" fill="#262626" stroke="#333333" stroke-width="1"/>
  <text x="275" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">⚡ Add node or action... <tspan fill="#818cf8" font-weight="700">Ctrl+K</tspan></text>

  <rect x="520" y="14" width="70" height="28" rx="6" fill="#262626" stroke="#333333" stroke-width="1"/>
  <text x="532" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e2e8f0">↩ ↪ zundo</text>

  <rect x="1040" y="14" width="136" height="28" rx="6" fill="#6366f1"/>
  <text x="1108" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">▶ Execute Workflow</text>

  <!-- Left Sidebar (Node Palette) -->
  <rect x="0" y="56" width="220" height="619" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="20" y="88" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9ca3af">NODE PALETTE (DRAG &amp; DROP)</text>
  
  <rect x="12" y="105" width="196" height="40" rx="8" fill="#262626" stroke="#3b82f6" stroke-width="1"/>
  <text x="24" y="130" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#60a5fa">⚡ Webhook Trigger</text>
  
  <rect x="12" y="155" width="196" height="40" rx="8" fill="#262626" stroke="#a855f7" stroke-width="1"/>
  <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🤖 AI Classifier (Groq)</text>
  
  <rect x="12" y="205" width="196" height="40" rx="8" fill="#262626" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="230" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">🔀 Condition Branch</text>
  
  <rect x="12" y="255" width="196" height="40" rx="8" fill="#262626" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="280" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399">💬 Slack Action</text>

  <rect x="12" y="305" width="196" height="40" rx="8" fill="#262626" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">✉️ Resend Email Action</text>

  <!-- React Flow Infinite Canvas Grid (#141414) -->
  <rect x="220" y="56" width="660" height="619" fill="#141414"/>
  <!-- Canvas Grid Dots Pattern -->
  <circle cx="250" cy="100" r="1.5" fill="#333333"/>
  <circle cx="300" cy="100" r="1.5" fill="#333333"/>
  <circle cx="350" cy="100" r="1.5" fill="#333333"/>
  <circle cx="400" cy="100" r="1.5" fill="#333333"/>
  <circle cx="450" cy="100" r="1.5" fill="#333333"/>

  <!-- Connecting Bezier Edges -->
  <!-- Edge 1 -> 2 -->
  <path d="M 410 160 C 460 160, 460 260, 500 260" stroke="#6366f1" stroke-width="3" fill="none"/>
  <!-- Edge 2 -> 3 -->
  <path d="M 680 260 C 720 260, 720 380, 500 380" stroke="#a855f7" stroke-width="3" fill="none"/>
  <!-- Edge 3 -> 4 (Slack) -->
  <path d="M 680 380 C 730 380, 730 480, 500 480" stroke="#10b981" stroke-width="3" fill="none"/>

  <!-- React Flow Canvas Nodes -->

  <!-- Node 1: Webhook Trigger -->
  <rect x="250" y="120" width="160" height="80" rx="10" fill="#262626" stroke="#3b82f6" stroke-width="2"/>
  <rect x="250" y="120" width="160" height="26" rx="10" fill="#1d4ed8"/>
  <text x="262" y="138" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">⚡ Webhook Trigger</text>
  <text x="262" y="165" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e5e7eb">Customer Cancelled</text>
  <text x="262" y="183" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#9ca3af">Event: subscription.deleted</text>
  <circle cx="410" cy="160" r="6" fill="#3b82f6"/>

  <!-- Node 2: AI Classifier -->
  <rect x="500" y="220" width="180" height="90" rx="10" fill="#262626" stroke="#a855f7" stroke-width="2"/>
  <rect x="500" y="220" width="180" height="26" rx="10" fill="#7e22ce"/>
  <text x="512" y="238" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">🤖 AI Classifier (Groq LLM)</text>
  <text x="512" y="265" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e5e7eb">Prompt: Churn Risk Level</text>
  <text x="512" y="285" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#c084fc">Output: { risk: &quot;HIGH&quot; }</text>
  <circle cx="500" cy="260" r="6" fill="#a855f7"/>
  <circle cx="680" cy="260" r="6" fill="#a855f7"/>

  <!-- Node 3: Condition -->
  <rect x="500" y="340" width="180" height="80" rx="10" fill="#262626" stroke="#f59e0b" stroke-width="2"/>
  <rect x="500" y="340" width="180" height="26" rx="10" fill="#b45309"/>
  <text x="512" y="358" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">🔀 Condition Branch</text>
  <text x="512" y="385" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e5e7eb">Check risk == &quot;HIGH&quot;</text>
  <text x="512" y="403" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fbbf24">Evaluates to TRUE</text>
  <circle cx="500" cy="380" r="6" fill="#f59e0b"/>
  <circle cx="680" cy="380" r="6" fill="#f59e0b"/>

  <!-- Node 4: Action Slack -->
  <rect x="500" y="440" width="180" height="80" rx="10" fill="#262626" stroke="#10b981" stroke-width="2"/>
  <rect x="500" y="440" width="180" height="26" rx="10" fill="#047857"/>
  <text x="512" y="458" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">💬 Slack Action</text>
  <text x="512" y="485" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e5e7eb">Channel: #churn-alerts</text>
  <text x="512" y="503" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">Status: Sent (24ms)</text>
  <circle cx="500" cy="480" r="6" fill="#10b981"/>

  <!-- Right Panel: Monaco JSON Inspector & Execution Stats -->
  <rect x="880" y="56" width="320" height="619" fill="#141414" stroke="#333333" stroke-width="1"/>
  
  <text x="900" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#f9fafb">JSON Inspector (Monaco)</text>

  <rect x="900" y="105" width="280" height="260" rx="8" fill="#262626" stroke="#333333" stroke-width="1"/>
  <text x="915" y="130" font-family="Consolas, monospace" font-size="11" fill="#f9fafb">{</text>
  <text x="925" y="150" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">&quot;event&quot;: <tspan fill="#34d399">&quot;customer.churn&quot;</tspan>,</text>
  <text x="925" y="170" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">&quot;customer_id&quot;: <tspan fill="#34d399">&quot;cust_8412&quot;</tspan>,</text>
  <text x="925" y="190" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">&quot;mrr_lost&quot;: <tspan fill="#60a5fa">490.00</tspan>,</text>
  <text x="925" y="210" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">&quot;ai_analysis&quot;: {</text>
  <text x="940" y="230" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">&quot;risk&quot;: <tspan fill="#c084fc">&quot;HIGH&quot;</tspan>,</text>
  <text x="940" y="250" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">&quot;confidence&quot;: <tspan fill="#60a5fa">0.96</tspan></text>
  <text x="925" y="270" font-family="Consolas, monospace" font-size="11" fill="#9ca3af">}</text>
  <text x="915" y="290" font-family="Consolas, monospace" font-size="11" fill="#f9fafb">}</text>

  <!-- Execution Stats ECharts -->
  <text x="900" y="400" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#f9fafb">Step Duration (ECharts)</text>
  <rect x="900" y="415" width="280" height="200" rx="8" fill="#262626" stroke="#333333" stroke-width="1"/>
  
  <text x="915" y="445" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">Trigger (12ms)</text>
  <rect x="915" y="455" width="60" height="14" rx="3" fill="#3b82f6"/>

  <text x="915" y="490" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">AI Groq (142ms)</text>
  <rect x="915" y="500" width="230" height="14" rx="3" fill="#a855f7"/>

  <text x="915" y="535" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">Condition (2ms)</text>
  <rect x="915" y="545" width="25" height="14" rx="3" fill="#f59e0b"/>

  <text x="915" y="580" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">Slack API (24ms)</text>
  <rect x="915" y="590" width="85" height="14" rx="3" fill="#10b981"/>
</svg>
