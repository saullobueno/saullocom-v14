version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Atualizacoes menores e correcoes entram juntas em um unico PR
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint ainda nao suporta TypeScript 7 (revisar quando suportar)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # os tipos acompanham o Node em uso (.nvmrc); subir o major dos tipos sem subir o Node
      # descreve APIs que o runtime nao tem
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
