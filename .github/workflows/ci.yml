name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Os testes usam o Chrome ja instalado no runner (channel: 'chrome')
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-de-testes
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
